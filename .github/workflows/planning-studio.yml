name: Planning Studio and local scanner
on:
  push:
    branches: [main]
    paths: ["website/**", "scanner/**", "scripts/package_scanner.py", ".github/workflows/planning-studio.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", "scanner/**", "scripts/package_scanner.py", ".github/workflows/planning-studio.yml"]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.4.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate consent and source pin without scanning the runner
        run: python3 -m unittest discover -s scanner/tests -v
