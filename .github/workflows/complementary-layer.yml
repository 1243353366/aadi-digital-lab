name: Keyless complementary jobs
on:
  push:
    branches: [main, "security/**"]
    paths: ["integrations/freellmapi/**", "website/**", ".github/workflows/complementary-layer.yml"]
  pull_request:
    branches: [main]
    paths: ["integrations/freellmapi/**", "website/**", ".github/workflows/complementary-layer.yml"]
permissions:
  contents: read
jobs:
  mocked-keyless-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node integrations/freellmapi/verify.mjs
      - run: node --test integrations/freellmapi/adapter.test.mjs
  protected-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.4.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
