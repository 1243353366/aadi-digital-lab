name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check all backend and frontend JS modules
        run: npx -y esbuild fullstack/src/index.js $(find fullstack/api fullstack/public/js -name '*.js') --outdir=.js-dist --format=esm

      - name: Lint the D1 schema with SQLite
        run: |
          sudo apt-get install -y -q sqlite3 >/dev/null
          sqlite3 /tmp/check.db < fullstack/schema.sql
          sqlite3 /tmp/check.db "SELECT COUNT(*) FROM posts; SELECT COUNT(*) FROM users;"
