name = "aadi-digital-lab-fullstack"
main = "src/index.js"
compatibility_date = "2026-05-01"
# The Ask Corpora proxy fetches the corpora-ai worker, another Worker on this
# same zone. Same-zone worker-to-worker fetch needs this flag to be treated
# as a normal public fetch (Cloudflare error 1042 otherwise).
compatibility_flags = ["global_fetch_strictly_public"]

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "blog_db"
database_id = "038c5843-0c9d-43ea-8347-b8840768b95d"
