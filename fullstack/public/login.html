<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Aadi's Digital Lab</title>
  <meta name="description" content="Admin sign-in for Aadi's Digital Lab.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <script src="js/theme-init.js"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="top">
    <div class="wrap nav-inner">
      <a class="logo" href="index.html" aria-label="Aadi's Digital Lab — home">
        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="14" fill="var(--accent-soft)"/>
          <path d="M27 12h10v9l11.5 22.8A5 5 0 0 1 44.1 51H19.9a5 5 0 0 1-4.4-7.2L27 21z"
                fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="27" cy="43" r="2.5" fill="currentColor"/>
          <circle cx="36" cy="45.5" r="1.8" fill="currentColor"/>
        </svg>
        <span>Aadi&rsquo;s Digital&nbsp;Lab</span>
      </a>
      <nav class="nav-menu" id="nav-links" aria-label="Primary">
        <a href="blog.html">Blog</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="wrap login-page">
      <div class="login-card">
        <p class="eyebrow">Admin access</p>
        <h1>Sign in</h1>
        <p class="post-meta">Manage posts, tags, and settings.</p>
        <form id="login-form">
          <div class="field">
            <label for="l-user">Username</label>
            <input id="l-user" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="l-pass">Password</label>
            <input id="l-pass" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="login-btn">Sign in</button>
          <p id="login-msg" class="status-note" hidden></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-bottom">
      <p>&copy; <span id="year">2026</span> Aadi&rsquo;s Digital Lab</p>
      <p><a href="index.html">Back to the Lab &rarr;</a></p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
