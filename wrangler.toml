name = "aadi-digital-lab"
compatibility_date = "2026-05-01"
pages_build_output_dir = "."

# D1 binding for the blog API.
#
# IMPORTANT (deployment assumption, fixed 2026-09): this file IS used by
# Cloudflare Pages when the project is Git-connected (config-as-code), so a
# placeholder database_id here would break the build. Bind the database in
# the dashboard instead:
#
#   Pages project → Settings → Functions → D1 database bindings
#   Binding name: DB   Database: blog_db
#
# If you deploy with the Wrangler CLI instead, uncomment the block below
# and paste your real database_id (D1 → blog_db → Settings → Database ID).
#
# [[d1_databases]]
# binding = "DB"
# database_name = "blog_db"
# database_id = "<paste-your-real-d1-id-here>"
